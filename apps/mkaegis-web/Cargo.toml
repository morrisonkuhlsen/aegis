[package]
name = "mkaegis-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "MK aeGIS in the browser (eframe web runner: WebGPU, WebGL2 where it isn't available)"

[lints]
workspace = true

[dependencies]
mkaegis-engine = { workspace = true }
mkaegis-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "BeforeUnloadEvent",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Navigator",
    "Storage",
    "Url",
    "UrlSearchParams",
    "Window",
] }
