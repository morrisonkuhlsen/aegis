<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="description" content="MK aeGIS, a statistical GIS, in the browser: your data stays on your computer.">
  <title>MK aeGIS</title>
  <link data-trunk rel="rust" data-bin="mkaegis-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f4f2; }
    #mkaegis_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #mkaegis_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center; color: #4a4a4a; font: 15px system-ui, sans-serif; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1e1f22; }
      #mkaegis_loading { color: #c8c8c8; }
    }
  </style>
</head>
<body>
  <canvas id="mkaegis_canvas"></canvas>
  <div id="mkaegis_loading">Loading MK aeGIS&hellip;</div>
</body>
</html>
